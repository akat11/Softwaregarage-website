<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Per-page SEO (title, description, canonical, Open Graph, Twitter, JSON-LD).
       Filled from src/data/seo.ts by scripts/vite-plugin-seo.ts. -->
  <!--seo-->

  <meta name="author" content="Software Garage" />
  <meta name="application-name" content="Software Garage" />
  <meta name="apple-mobile-web-app-title" content="Software Garage" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Theme -->
  <meta name="theme-color" content="#050505" />
  <meta name="color-scheme" content="dark" />

  <!-- Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Loaded non-render-blocking (loadCSS pattern): the browser fetches this
       in the background instead of pausing first paint on it, then the
       onload flips it from print-only to all-media once it's ready. The
       noscript fallback keeps fonts working with JS disabled. -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </noscript>
</head>

<body>
  <noscript>
    Software Garage is a global digital product and technology studio building web apps,
    mobile apps, SaaS, Web3, e-commerce, UI/UX, QA automation and AI solutions.
    Please enable JavaScript to view this website.
  </noscript>
  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
