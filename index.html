<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- Primary SEO -->
  <title>
    Software Garage | Global Digital Product & Technology Studio
  </title>

  <meta
    name="description"
    content="Software Garage builds, tests and transforms digital products through web development, mobile apps, SaaS, UI/UX, QA automation, AI and modern technology solutions."

  <meta
    name="keywords"
    content="Software Garage, software development company, web development, mobile app development, SaaS development, UI UX design, QA testing, automation testing, AI solutions, blockchain development, digital product development"
  />

  <meta name="author" content="Software Garage" />
  <meta name="robots" content="index, follow" />
  <meta name="googlebot" content="index, follow" />

  <!-- Canonical -->
  <link
    rel="canonical"
    href="https://softwaregarage.netlify.app/"
  />

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="/favicon.svg"
  />

  <link
    rel="apple-touch-icon"
    href="/favicon.svg"
  />

  <!-- Theme -->
  <meta name="theme-color" content="#050505" />
  <meta name="color-scheme" content="dark" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Software Garage" />

  <meta
    property="og:title"
    content="Software Garage | Global Digital Product & Technology Studio"
  />

  <meta
    property="og:description"
    content="We build, test and transform powerful digital products for ambitious businesses around the world."
  />

  <meta
    property="og:url"
    content="https://softwaregarage.netlify.app/"
  />

  <meta
    property="og:image"
    content="https://softwaregarage.netlify.app/og-image.jpg"
  />

  <meta
    property="og:image:alt"
    content="Software Garage - Global Digital Product & Technology Studio"
  />

  <meta property="og:locale" content="en_US" />

  <!-- Twitter / X -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Software Garage | Global Digital Product & Technology Studio"
  />

  <meta
    name="twitter:description"
    content="Global digital engineering studio. Build. Test. Transform."
  />

  <meta
    name="twitter:image"
    content="https://softwaregarage.netlify.app/og-image.jpg"
  />

  <meta
    name="twitter:image:alt"
    content="Software Garage - Global Digital Product & Technology Studio"
  />

  <!-- Performance -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Organization Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Software Garage",
      "url": "https://softwaregarage.netlify.app/",
      "logo": "https://softwaregarage.netlify.app/favicon.svg",
      "description": "Global digital product and technology studio specializing in software development, UI/UX, QA automation, AI and modern technology solutions."

</head>

<body>
  <div id="root"></div>

    type="module"
