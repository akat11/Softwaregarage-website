  <g transform="translate(755 62) rotate(-4)"><rect width="125" height="222" rx="11" fill="#101210" stroke="#626861" stroke-width="2"/><text x="15" y="34" font-family="monospace" font-size="10" fill="#f4f4f4">▯  MOBILE</text><rect x="39" y="63" width="48" height="91" rx="9" fill="#050605" stroke="#b7ff00" opacity=".65"/><circle cx="63" cy="141" r="3" fill="#b7ff00"/><text x="15" y="193" font-family="Arial" font-size="15" fill="#f4f4f4">Mobile Apps</text></g>
  <g transform="translate(872 70) rotate(-2)"><rect width="117" height="214" rx="11" fill="#101210" stroke="#626861" stroke-width="2"/><text x="15" y="34" font-family="monospace" font-size="10" fill="#f4f4f4">⚙  QA</text><rect x="20" y="122" width="14" height="40" fill="#b7ff00" opacity=".6"/><rect x="42" y="96" width="14" height="66" fill="#b7ff00" opacity=".8"/><rect x="64" y="75" width="14" height="87" fill="#b7ff00"/><text x="15" y="192" font-family="Arial" font-size="14" fill="#f4f4f4">Software</text><text x="15" y="210" font-family="Arial" font-size="14" fill="#f4f4f4">Testing</text></g>
  <g transform="translate(982 78) rotate(1)"><rect width="103" height="206" rx="11" fill="#101210" stroke="#626861" stroke-width="2"/><text x="13" y="33" font-family="monospace" font-size="9" fill="#f4f4f4">▣  SAAS</text><path d="M27 91 51 77 76 91 51 105Z M27 91v37l24 14v-37Zm49 0v37l-25 14v-37Z" fill="#c8ff3d" opacity=".7"/><text x="13" y="177" font-family="Arial" font-size="13" fill="#f4f4f4">SaaS</text><text x="13" y="194" font-family="Arial" font-size="13" fill="#f4f4f4">Platforms</text></g>
  <g transform="translate(1078 88) rotate(3)"><rect width="105" height="196" rx="11" fill="#101210" stroke="#626861" stroke-width="2"/><text x="11" y="32" font-family="monospace" font-size="8" fill="#f4f4f4">▱ E-COMMERCE</text><path d="M25 80h53l-6 58H32Z" fill="#deded8" opacity=".8"/><path d="M39 80c0-18 25-18 25 0" fill="none" stroke="#555" stroke-width="4"/><text x="11" y="177" font-family="Arial" font-size="13" fill="#f4f4f4">E-commerce</text></g>
