<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">More work selected projects</title>
  <desc id="desc">A neon Software Garage project showcase with web, mobile, QA, SaaS and e-commerce cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050605"/><stop offset="1" stop-color="#0c1107"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4ff35"/><stop offset="1" stop-color="#82bd00"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#b7ff00" stop-opacity=".25"/><stop offset="1" stop-color="#b7ff00" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#b7ff00" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="380" rx="18" fill="url(#bg)" stroke="#30352a"/>
  <ellipse cx="820" cy="174" rx="370" ry="170" fill="url(#glow)" filter="url(#blur)"/>
  <g font-family="monospace" letter-spacing="4" fill="#b7ff00"><circle cx="42" cy="48" r="5"/><text x="60" y="54" font-size="13">MORE WORK  •  SELECTED PROJECTS</text></g>
  <g font-family="Arial, sans-serif" font-weight="800"><text x="42" y="132" font-size="58" fill="#f5f5f5">15+ PROJECTS.</text><text x="42" y="195" font-size="53" fill="url(#lime)">MORE IN THE WORKS.</text></g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#999"><text x="42" y="236">These are just a selection of projects we&apos;ve delivered across</text><text x="42" y="260">web, mobile, SaaS, e-commerce, and software testing.</text></g>
  <rect x="42" y="295" width="210" height="48" rx="24" fill="#b7ff00"/><text x="72" y="325" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#101407">VIEW MORE PROJECTS  →</text>
  <text x="286" y="325" font-family="monospace" font-size="12" letter-spacing="2" fill="#d7d7d7">LET&apos;S WORK TOGETHER  →</text>
